services:
  backend:
    build:
      context: ./server
    container_name: assetflow_backend_prod
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    volumes:
      - uploads:/app/uploads
    networks:
      - assetflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: assetflow_nginx_prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - assetflow-network
    restart: unless-stopped

networks:
  assetflow-network:
    driver: bridge

volumes:
  uploads:
